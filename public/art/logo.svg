<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Doodleville logo" class="dv-art dv-logo"><defs><pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#fff"/><line x1="0" y1="0" x2="0" y2="7" stroke="#111" stroke-width="2.2"/></pattern></defs><style>@media (prefers-reduced-motion: no-preference){.dv-logo .arm,.dv-logo .head,.dv-logo .face,.dv-logo .tail,.dv-logo .crest,.dv-logo .wing,.dv-logo .antennae,.dv-logo .hair,.dv-logo .char,.dv-logo .balloon{transform-box:view-box}.dv-logo .eyes{transform-box:fill-box;transform-origin:center;animation:dv-blink 4s linear infinite;animation-delay:calc(var(--i,0)*.7s + .4s)}.dv-logo .eyes.happy{animation:none}.dv-logo .eyes{animation-duration:5s;animation-delay:1.2s}@keyframes dv-blink{0%,90%,96%,100%{transform:scaleY(1)}93%{transform:scaleY(.1)}}}</style><g fill="#fff" stroke="#111" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M32,4 C38,16 52,26 52,40 C52,52 43,60 32,60 C21,60 12,52 12,40 C12,26 26,16 32,4Z" fill="#111"/><g class="eyes"><circle cx="25" cy="37" r="3.6" fill="#fff" stroke="none"/><circle cx="39" cy="37" r="3.6" fill="#fff" stroke="none"/></g><path d="M23,46 Q32,54 41,46" fill="none" stroke="#fff" stroke-width="3.5"/><path d="M19,32 Q18,24 23,19" fill="none" stroke="#fff" stroke-width="2.5"/></g></svg>
